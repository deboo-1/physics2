<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics II — HNU Study Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   PHYSICS II STUDY PLATFORM — ENHANCED v7
   HNU · ISE · Spring 2025-2026
═══════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surface:#0d1117;--card:#111827;--card2:#0f1923;--border:#1f2d3d;
  --blue:#3b82f6;--cyan:#06b6d4;--green:#10b981;--purple:#8b5cf6;
  --orange:#f59e0b;--red:#ef4444;--text:#f0f4f8;--muted:#64748b;
  --accent:#3b82f6;--radius:10px;
}

body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.6}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh}
.sidebar{width:270px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s;scrollbar-width:thin;scrollbar-color:#1f2d3d transparent}
.main{margin-left:270px;flex:1;min-height:100vh;display:flex;flex-direction:column}

@media(max-width:768px){
  .sidebar{transform:translateX(-270px)}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0}.menu-btn{display:flex!important}
}

/* ── SIDEBAR ── */
.brand{padding:20px 16px 14px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#080f1a,#0d1b2a)}
.brand-icon{font-size:22px;margin-bottom:4px}
.brand-title{font-size:15px;font-weight:700;background:linear-gradient(90deg,#60a5fa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}

/* Progress bar in sidebar */
.sidebar-progress{padding:10px 12px;border-bottom:1px solid var(--border);background:#080d14}
.sp-label{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px}
.sp-label strong{color:#60a5fa}
.sp-bar{height:4px;background:#1e2d40;border-radius:4px;overflow:hidden}
.sp-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#06b6d4);border-radius:4px;transition:width .5s ease}

/* Search in sidebar */
.sidebar-search{padding:10px 10px;border-bottom:1px solid var(--border)}
.search-input-wrap{position:relative}
.search-input-wrap input{width:100%;padding:7px 10px 7px 30px;background:#080d14;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;font-family:inherit;outline:none;transition:border .2s}
.search-input-wrap input:focus{border-color:#3b82f6}
.search-input-wrap input::placeholder{color:#4b5563}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;color:#4b5563;pointer-events:none}
.search-results-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#0d1117;border:1px solid #1e3a5f;border-radius:8px;max-height:220px;overflow-y:auto;z-index:200;display:none}
.search-results-dropdown.open{display:block}
.sr-item{padding:8px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid #111827;transition:background .1s;color:#94a3b8}
.sr-item:hover{background:#1e2d40;color:var(--text)}
.sr-item .sr-type{font-size:10px;color:#3b82f6;font-weight:600;display:block;margin-bottom:1px}
.sr-item:last-child{border-bottom:none}
.sr-empty{padding:10px 12px;font-size:12px;color:var(--muted);text-align:center}

.lang-toggle{margin:10px 8px 4px;background:#080d14;border:1px solid var(--border);border-radius:8px;padding:6px;display:flex;gap:4px}
.lang-btn{flex:1;padding:5px 4px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);transition:all .15s;font-family:'Cairo','IBM Plex Sans',sans-serif}
.lang-btn.active{background:#1d3557;color:#60a5fa}

.nav-section{padding:10px 12px 4px;font-size:10px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:.1em}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;color:#94a3b8;transition:all .15s;margin:1px 6px;border:none;background:none;width:calc(100% - 12px);text-align:left;position:relative}
.nav-item:hover{background:#1a2740;color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,#1d3557,#192a44);color:#60a5fa;border-left:3px solid var(--blue)}
.nav-item .icon{width:18px;font-size:13px;text-align:center;flex-shrink:0}
.nav-item .lec-num{font-size:9.5px;background:#1e3a5f;color:#60a5fa;padding:1px 5px;border-radius:4px;font-family:'IBM Plex Mono',monospace}
.nav-badge{margin-left:auto;font-size:10px;padding:2px 6px;border-radius:10px;background:#1e3a5f;color:#60a5fa}
.nav-done{margin-left:auto;font-size:11px;color:#10b981}

/* ── TOP BAR ── */
.topbar{height:54px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;position:sticky;top:0;z-index:50}
.menu-btn{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px}
.topbar-title{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:#1d3557;color:#60a5fa;white-space:nowrap}

/* ── CONTENT ── */
.content{padding:20px 24px;flex:1;max-width:980px;margin:0 auto;width:100%}
@media(max-width:600px){.content{padding:14px 14px}}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,#0b1520,#142035);border:1px solid #1e3a5f;border-radius:14px;padding:24px 26px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'⚡';position:absolute;right:16px;top:8px;font-size:90px;opacity:.04;pointer-events:none}
.hero-title{font-size:21px;font-weight:700;background:linear-gradient(90deg,#60a5fa,#22d3ee,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;line-height:1.3}
.hero-sub{font-size:12.5px;color:#94a3b8;line-height:1.7}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;transition:border-color .2s}
.stat:hover{border-color:#1e3a5f}
.stat-n{font-size:26px;font-weight:700;color:#3b82f6;font-family:'IBM Plex Mono',monospace}
.stat-l{font-size:10.5px;color:var(--muted);margin-top:2px}
.stat-n.green{color:#10b981}.stat-n.purple{color:#a78bfa}.stat-n.orange{color:#f59e0b}

/* ── PROGRESS HOME ── */
.progress-home{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.ph-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ph-title{font-size:13px;font-weight:700;color:#60a5fa}
.ph-pct{font-size:20px;font-weight:700;color:#10b981;font-family:'IBM Plex Mono',monospace}
.ph-bar{height:8px;background:#1e2d40;border-radius:8px;overflow:hidden;margin-bottom:8px}
.ph-fill{height:100%;background:linear-gradient(90deg,#10b981,#3b82f6);border-radius:8px;transition:width .6s ease}
.ph-info{font-size:11px;color:var(--muted);display:flex;gap:16px}
.ph-info span{display:flex;align-items:center;gap:4px}

/* ── SECTION TITLE ── */
.section-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

/* ── LECTURE GRID ── */
.lec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
@media(max-width:600px){.lec-grid{grid-template-columns:1fr}}
.lec-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.lec-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--lc,linear-gradient(90deg,#3b82f6,#06b6d4))}
.lec-card:hover{border-color:#2a4060;transform:translateY(-1px);box-shadow:0 4px 20px #00000030}
.lec-card-num{font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:#3b82f6;font-weight:600}
.lec-card-title{font-size:13.5px;font-weight:600;margin:4px 0 3px;color:var(--text);line-height:1.3}
.lec-card-sub{font-size:11px;color:var(--muted);line-height:1.5}
.lec-card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.lec-card-done{position:absolute;top:10px;right:10px;font-size:13px}
.tag{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500}
.tag-b{background:#1d3557;color:#60a5fa;border:1px solid #1e3a5f40}
.tag-c{background:#0a2a2e;color:#22d3ee;border:1px solid #06b6d440}
.tag-p{background:#1e1b35;color:#a78bfa;border:1px solid #8b5cf640}
.tag-g{background:#0a2a1e;color:#34d399;border:1px solid #10b98140}
.tag-o{background:#2a1e0a;color:#fbbf24;border:1px solid #f59e0b40}
.tag-r{background:#2a0a0a;color:#f87171;border:1px solid #ef444440}

/* ── LECTURE PAGE ── */
.tabs-row{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:18px;background:var(--card);padding:5px;border-radius:var(--radius);border:1px solid var(--border)}
.tab-btn{padding:7px 13px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);transition:all .15s;font-family:inherit}
.tab-btn.active{background:var(--blue);color:#fff}
.tab-btn:hover:not(.active){color:var(--text);background:#1a2740}
.tab-pane{display:none}.tab-pane.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── INFO CARD ── */
.info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.info-card h3{font-size:12.5px;font-weight:700;color:#60a5fa;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.info-card p,.info-card li{font-size:12.5px;color:#94a3b8;line-height:1.85}
.info-card ul{padding-left:18px}
.ar-explain{background:linear-gradient(135deg,#080f1c,#0c1728);border:1px solid #1e3a5f;border-radius:var(--radius);padding:16px;font-family:'Cairo',sans-serif;direction:rtl;text-align:right;font-size:13px;color:#94a3b8;line-height:2;margin-bottom:12px}
.ar-explain strong{color:#60a5fa}

/* ── MARK DONE BTN ── */
.mark-done-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .2s;font-family:inherit;margin-bottom:14px}
.mark-done-btn.done{background:#0a2a1e;border-color:#10b98150;color:#34d399}
.mark-done-btn:hover:not(.done){border-color:#3b82f6;color:#60a5fa}

/* ── FORMULAS ── */
.formula-card{background:#07101c;border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;transition:border-color .2s}
.formula-card:hover{border-color:#1e3a5f}
.formula-eq{font-family:'IBM Plex Mono',monospace;font-size:14.5px;color:#06b6d4;margin:6px 0;padding:10px 14px;background:#040c18;border-radius:6px;border-left:3px solid #06b6d4;overflow-x:auto;white-space:nowrap}
.formula-name{font-size:12px;font-weight:700;color:#60a5fa;margin-bottom:3px}
.formula-desc{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.65}
.formula-vars{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.var-pill{font-size:10px;padding:2px 8px;background:#1a2a3a;color:#94a3b8;border-radius:6px;font-family:'IBM Plex Mono',monospace}

/* ── VIDEO ── */
.video-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;transition:border-color .2s}
.video-card:hover{border-color:#1e3a5f}
.video-icon{width:42px;height:42px;border-radius:10px;background:#1d3557;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.video-info .video-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.video-info .video-desc{font-size:11px;color:var(--muted)}
.video-link{margin-left:auto;padding:6px 14px;background:#1d3557;color:#60a5fa;border:1px solid #1e3a5f;border-radius:7px;font-size:11.5px;font-weight:600;text-decoration:none;white-space:nowrap;transition:all .15s;flex-shrink:0}
.video-link:hover{background:#3b82f6;color:#fff;border-color:#3b82f6}

/* ── MCQ / PRACTICE ── */
.mcq-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.mcq-score{font-size:12.5px;color:var(--muted)}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:border-color .2s}
.q-num{font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:#3b82f6;font-weight:600;margin-bottom:6px}
.q-text{font-size:13px;color:var(--text);line-height:1.75;margin-bottom:12px}
.q-options{display:flex;flex-direction:column;gap:5px}
.q-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;color:#94a3b8;transition:all .15s;background:none;text-align:left;width:100%;font-family:inherit}
.q-opt:hover:not(:disabled){border-color:#3b82f6;color:var(--text);background:#111d2e}
.q-opt.correct{border-color:#10b981!important;background:#071f14!important;color:#34d399!important}
.q-opt.wrong{border-color:#ef4444!important;background:#1c0707!important;color:#f87171!important}
.q-opt:disabled{cursor:default}
.q-opt .opt-letter{width:22px;height:22px;border-radius:6px;background:#1e2d40;color:#60a5fa;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0;font-family:'IBM Plex Mono',monospace}
.explanation{margin-top:12px;padding:12px 14px;border-radius:8px;font-size:12px;line-height:1.75;display:none}
.explanation.show{display:block}
.exp-correct{background:#071f14;border:1px solid #10b98130;color:#6ee7b7}
.exp-wrong{background:#1c110a;border:1px solid #f59e0b30;color:#fde68a}
.exp-ref{font-size:10.5px;color:#f59e0b;margin-top:6px;padding-top:6px;border-top:1px solid #f59e0b20}
.submit-btn{padding:10px 22px;background:linear-gradient(135deg,#1d4ed8,#1e3fa0);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.submit-btn:hover{background:linear-gradient(135deg,#2563eb,#1d4ed8);transform:translateY(-1px)}
.reset-btn{padding:10px 18px;background:var(--card);color:#94a3b8;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.reset-btn:hover{border-color:#3b82f6;color:#60a5fa}
.result-card{background:linear-gradient(135deg,#0a1828,#132140);border:1px solid #1e3a5f;border-radius:14px;padding:24px;margin-bottom:20px;text-align:center}
.result-score{font-size:42px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.result-label{font-size:13px;color:#94a3b8;margin-top:4px}
.result-rating{font-size:15px;font-weight:700;margin-top:10px}

/* ── NOTES ── */
.note-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.note-box h4{font-size:12px;font-weight:700;color:#f59e0b;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.note-box p,.note-box li{font-size:12.5px;color:#94a3b8;line-height:1.85}
.note-box ul{padding-left:18px}
.note-box .highlight{color:#34d399;font-weight:600}
.note-box .warning{color:#f87171;font-weight:600}
.note-box .formula-inline{font-family:'IBM Plex Mono',monospace;color:#06b6d4;background:#040c18;padding:2px 7px;border-radius:4px;font-size:11.5px;border:1px solid #06b6d420}

/* ── EXAM BADGE ── */
.exam-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;background:#1e1500;border:1px solid #f59e0b40;color:#fbbf24;border-radius:8px;font-size:11px;font-weight:600;margin-bottom:14px}

/* ── EXAM TIMER ── */
.exam-timer-bar{background:linear-gradient(135deg,#1a0c00,#2a1500);border:1px solid #f59e0b30;border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.exam-timer-display{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;color:#fbbf24}
.exam-timer-display.warning{color:#ef4444;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.exam-progress-info{font-size:12px;color:#94a3b8;display:flex;gap:14px;align-items:center}
.exam-progress-info span{display:flex;align-items:center;gap:4px}

/* ── ANSWER REVIEW ── */
.review-section{margin-top:24px}
.review-header{font-size:15px;font-weight:700;color:#60a5fa;margin-bottom:14px;padding:10px 14px;background:#0a1525;border-radius:8px;border-left:3px solid #3b82f6;display:flex;align-items:center;gap:8px}
.review-q{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.review-q.correct-q{border-color:#10b98130}
.review-q.wrong-q{border-color:#ef444430}
.review-q-num{font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.review-badge{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700}
.rb-correct{background:#0a2a1e;color:#34d399}
.rb-wrong{background:#2a0a0a;color:#f87171}
.rb-unanswered{background:#1a1a0a;color:#fbbf24}
.review-q-text{font-size:12.5px;color:var(--text);line-height:1.7;margin-bottom:8px}
.review-answer{font-size:11.5px;padding:6px 10px;border-radius:6px;margin-bottom:4px}
.ra-your{background:#111d2e;border-left:3px solid #3b82f6;color:#94a3b8}
.ra-correct{background:#071f14;border-left:3px solid #10b981;color:#34d399}
.ra-explain{font-size:11px;color:#6ee7b7;padding:8px 10px;background:#071f14;border-radius:6px;margin-top:6px;line-height:1.7;border:1px solid #10b98120}
.ra-explain.wrong-exp{color:#fde68a;background:#1c110a;border-color:#f59e0b20}

/* ── FINAL EXAM MODEL ── */
.model-exam-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:16px}
.model-exam-card:hover{border-color:#3b82f6;transform:translateY(-1px)}
.model-exam-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.model-exam-info h3{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.model-exam-info p{font-size:11.5px;color:var(--muted);line-height:1.5}
.model-exam-arrow{margin-left:auto;color:#3b82f6;font-size:18px}
.model-exam-badge{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;margin-left:8px}

/* ── FINAL EXAM PDF ── */
.pdf-section{background:linear-gradient(135deg,#0a0e1a,#111827);border:1px solid #1e2d40;border-radius:14px;padding:20px;margin-bottom:16px}
.pdf-section h3{font-size:14px;font-weight:700;color:#a78bfa;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pdf-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#080d14;border:1px solid #1a2535;border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.pdf-item:hover{border-color:#3b82f6;background:#0d1728}
.pdf-item-icon{font-size:22px;flex-shrink:0}
.pdf-item-info{flex:1}
.pdf-item-info strong{font-size:13px;font-weight:600;color:var(--text);display:block;margin-bottom:2px}
.pdf-item-info span{font-size:11px;color:var(--muted)}
.pdf-item-btn{padding:5px 14px;border-radius:7px;border:none;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.pdf-download-btn{background:#1d3557;color:#60a5fa}
.pdf-download-btn:hover{background:#3b82f6;color:#fff}
.pdf-view-btn{background:#1e1b35;color:#a78bfa}
.pdf-view-btn:hover{background:#8b5cf6;color:#fff}

/* ── MISC ── */
.divider{height:1px;background:var(--border);margin:16px 0}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:#94a3b8;font-size:12px;cursor:pointer;margin-bottom:16px;font-family:inherit;transition:all .15s}
.back-btn:hover{border-color:#3b82f6;color:#60a5fa}
.overlay{display:none;position:fixed;inset:0;background:#00000085;z-index:90}
.overlay.show{display:block}
.empty-msg{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.quiz-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

/* ── ARABIC RTL SUPPORT ── */
.ar-text{font-family:'Cairo',sans-serif;direction:rtl;text-align:right;line-height:2;font-size:13px}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:#1d3557;border:1px solid #3b82f6;color:#60a5fa;padding:10px 18px;border-radius:10px;font-size:12.5px;font-weight:600;z-index:999;animation:slideUp .3s ease;opacity:0;pointer-events:none}
.toast.show{opacity:1}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── SCROLLBAR STYLING ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1e2d40;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#2a3f55}

    {icon:"⚡",title:"Electric Field Definition",content:"<span class='formula-inline'>E = F/q₀</span> (force per unit positive test charge)<br>• E is a VECTOR field<br>• Units: N/C = V/m<br>• For point charge Q at distance R: <span class='formula-inline'>E = Q/(4πε₀R²) â_R</span>"},
    {icon:"📏",title:"Field Lines Rules",content:"• Start on positive charges, end on negative charges<br>• Never cross each other<br>• Density of lines ∝ field strength<br>• Lines are perpendicular to conductor surfaces"},
    {icon:"📊",title:"Charge Densities",content:"• <span class='highlight'>Line charge:</span> ρ_L (C/m) → E = ρ_L/(2πε₀ρ) â_ρ<br>• <span class='highlight'>Surface charge:</span> ρ_S (C/m²) → E = ρ_S/(2ε₀) â_n<br>• <span class='highlight'>Volume charge:</span> ρ_V (C/m³) → integrate using Coulomb or Gauss"},
    {icon:"🔵",title:"Inside a Conductor",content:"<span class='warning'>E = 0 inside a perfect conductor in electrostatic equilibrium!</span><br>All excess charge resides on the outer surface. This is Faraday shielding."}
  ],
  formulas:[
    {name:"Electric Field — Point Charge",eq:"E = Q/(4πε₀R²) â_R",desc:"E field at distance R from point charge Q. Direction â_R points away from positive charge.",vars:["Q = source charge (C)","R = distance from source (m)","â_R = unit vector from source to field point"]},
    {name:"Electric Field — Line Charge",eq:"E = ρ_L/(2πε₀ρ) â_ρ",desc:"For infinite line charge with linear charge density ρ_L.",vars:["ρ_L = charge per unit length (C/m)","ρ = perpendicular distance from line"]},
    {name:"Electric Field — Surface Charge",eq:"E = ρ_S/(2ε₀) â_n",desc:"For infinite plane with surface charge density ρ_S. Uniform field on both sides.",vars:["ρ_S = charge per unit area (C/m²)","â_n = unit normal pointing away from surface"]},
    {name:"Superposition",eq:"E_total = E₁ + E₂ + ... + En",desc:"Vector sum of fields from all sources. Each field calculated independently.",vars:[]}
  ],
  mcq:[
    {q:"The electric field E is defined as:",opts:["E = Q × F","E = F/q₀ (force per unit positive test charge)","E = V/Q","E = Q·V"],ans:1,exp:"E = F/q₀ where q₀ is a small positive test charge. E is a vector (has direction) with units N/C = V/m.",ref:"Lec 3 — Electric Field Definition"},
    {q:"For a point charge +Q, the electric field at distance R:",opts:["Points toward Q","Points away from Q","Is zero","Is perpendicular to R"],ans:1,exp:"For positive Q, E = Q/(4πε₀R²) â_R. The unit vector â_R points AWAY from the positive charge. For negative Q, E points toward the charge.",ref:"Lec 3 — Point Charge Field"},
    {q:"The electric field inside a conductor in electrostatic equilibrium is:",opts:["E = ρ_S/ε₀","E = 0","E is maximum","E is uniform"],ans:1,exp:"Inside a conductor in static equilibrium, E = 0. All excess charges reside on the surface. This is why a Faraday cage protects against electric fields.",ref:"Lec 3 — Conductors"},
    {q:"For a point charge Q, the electric field magnitude at distance R is proportional to:",opts:["R","1/R","1/R²","R²"],ans:2,exp:"E = Q/(4πε₀R²) ∝ 1/R². E decreases as the square of distance (inverse square law). Same dependence as Coulomb's Law force.",ref:"Lec 3 — Point Charge"},
    {q:"Superposition principle for electric fields means:",opts:["Only the strongest field matters","Fields cancel each other out","Total E = vector sum of all individual fields","Total E = scalar sum of magnitudes"],ans:2,exp:"Superposition: E_total = E₁ + E₂ + ... Vector addition! You must consider both magnitude and direction.",ref:"Lec 3 — Superposition"},
    {q:"Surface charge density ρ_S has units of:",opts:["C/m","C/m²","C/m³","V/m"],ans:1,exp:"ρ_S = charge per unit area → C/m². Compare: line charge ρ_L = C/m, volume charge ρ_V = C/m³.",ref:"Lec 3 — Charge Densities"},
    {q:"Electric field lines start at:",opts:["Negative charges","Ground","Positive charges","Points of zero potential"],ans:2,exp:"Field lines start at positive charges and end at negative charges. They represent the direction a positive test charge would move.",ref:"Lec 3 — Field Lines"},
    {q:"The unit of electric field is:",opts:["Coulomb","Volt/meter = N/C","Farad","Tesla"],ans:1,exp:"[E] = N/C = V/m. Both are equivalent: 1 Newton/Coulomb = 1 Volt/meter. V/m is often more convenient in circuit analysis.",ref:"Lec 3 — Units"},
    {q:"For an infinite plane with positive surface charge density ρ_S, the field direction is:",opts:["Along the plane","Perpendicular to the plane, pointing away from it","Toward negative infinity","Circular around the plane"],ans:1,exp:"E = ρ_S/(2ε₀) â_n. The field is perpendicular to the infinite plane, pointing away from positive charge. It's uniform (doesn't depend on distance).",ref:"Lec 3 — Infinite Plane"},
    {q:"If two field lines cross each other, it means:",opts:["The field is very strong there","The field is zero there","This is impossible — field lines never cross","The charge is negative there"],ans:2,exp:"Field lines NEVER cross. If they did, it would mean E points in two different directions at the same point, which is impossible. The field has a unique direction at every point.",ref:"Lec 3 — Field Lines"}
  ]
},
4:{
  title:"Electric Potential",
  color:"linear-gradient(90deg,#8b5cf6,#06b6d4)",
  tags:["Potential V","Energy","Work"],
  tagClass:["tag-p","tag-b","tag-c"],
  track:"electricity",
  summary_en:"Electric potential V is the potential energy per unit positive charge. V is a scalar (easier to work with than E). The work done by external force to move charge Q from A to B is W = Q(V_B - V_A). E = -∇V links potential to field.",
  summary_ar:"الجهد الكهربائي V هو طاقة الوضع لكل وحدة شحنة موجبة. V كمية قياسية (أسهل من E). الشغل لنقل شحنة Q من A إلى B: W = Q(V_B - V_A). العلاقة E = -∇V تربط الجهد بالمجال.",
  notes:[
    {icon:"🔋",title:"Electric Potential",content:"<span class='formula-inline'>V = Q/(4πε₀R)</span> (due to point charge Q at distance R)<br>• V is a SCALAR field (no direction!)<br>• Units: Volts (V) = J/C<br>• Reference: V = 0 at R = ∞<br>• Multiple charges: V_total = V₁ + V₂ + ... (scalar addition!)"},
    {icon:"⚡",title:"Work and Energy",content:"Work done by external force moving charge Q from A to B:<br><span class='formula-inline'>W = Q(V_B - V_A) = -Q∫E·dl</span><br>• If moving positive charge AGAINST E field: W > 0 (you do work)"},
    {icon:"📈",title:"Equipotential Surfaces",content:"Surfaces of constant V. Key properties:<br>• E field is ALWAYS perpendicular to equipotential surfaces<br>• No work done moving charge along an equipotential<br>• For point charge: equipotentials are concentric spheres"},
    {icon:"🔗",title:"E from V",content:"<span class='formula-inline'>E = -∇V</span><br>In Cartesian: E = -(∂V/∂x âx + ∂V/∂y ây + ∂V/∂z âz)"}
  ],
  formulas:[
    {name:"Electric Potential — Point Charge",eq:"V = Q/(4πε₀R)",desc:"Potential at distance R from point charge Q. Note: 1/R (not 1/R²).",vars:["Q = charge (C)","R = distance (m)","V = 0 at R = ∞"]},
    {name:"Work to Move Charge",eq:"W = Q(V_B - V_A) = -Q∫_A^B E·dl",desc:"Work done by external agent to move charge Q from A to B.",vars:["V_A, V_B = potential at A and B"]},
    {name:"E from Potential (Cartesian)",eq:"E = -(∂V/∂x âx + ∂V/∂y ây + ∂V/∂z âz)",desc:"Electric field = negative gradient of potential.",vars:[]},
    {name:"V for surface charge disk",eq:"V = ρ_S/(2ε₀) × (√(a²+z²) - z)",desc:"On-axis potential above circular disk of radius a at height z.",vars:["a = disk radius","z = height above disk"]}
  ],
  mcq:[
    {q:"Electric potential V is:",opts:["A vector field","A scalar field","The same as electric field","Measured in N/C"],ans:1,exp:"V is a SCALAR (just a number at each point, no direction). This makes it easier to work with than E. Units are Volts (V = J/C).",ref:"Lec 4 — Electric Potential"},
    {q:"The electric potential due to a point charge Q at distance R is:",opts:["V = Q/(4πε₀R²)","V = Q/(4πε₀R)","V = kQ·R","V = Q²/(4πε₀R)"],ans:1,exp:"V = Q/(4πε₀R). Note the difference from E: potential falls as 1/R while field falls as 1/R².",ref:"Lec 4 — Point Charge Potential"},
    {q:"The work done to move charge Q from point A to B (V_A = 5V, V_B = 10V) is:",opts:["W = Q×5","W = Q×10","W = Q×15","W = Q(V_B-V_A) = 5Q"],ans:3,exp:"W = Q(V_B - V_A) = Q(10-5) = 5Q. If Q is positive, you must do positive work to move it to higher potential.",ref:"Lec 4 — Work & Energy"},
    {q:"Equipotential surfaces are always:",opts:["Parallel to E field lines","Perpendicular to E field lines","The same as field lines","Along the direction of E"],ans:1,exp:"E = -∇V, so E is perpendicular to surfaces of constant V. No work is done moving along an equipotential because W = Q(V_B-V_A) = 0 when V_A = V_B.",ref:"Lec 4 — Equipotentials"},
    {q:"For a point charge, equipotential surfaces are:",opts:["Flat planes","Cylinders","Concentric spheres","Random shapes"],ans:2,exp:"For a point charge at origin, V = Q/(4πε₀r) depends only on r. So V = constant means r = constant → concentric spheres.",ref:"Lec 4 — Equipotentials"},
    {q:"If V = 3x² + 2y, then the x-component of E is:",opts:["3x²","2","6x","-6x"],ans:3,exp:"Ex = -∂V/∂x = -∂(3x²+2y)/∂x = -6x. The NEGATIVE sign in E = -∇V is crucial — don't forget it!",ref:"Lec 4 — E from V"},
    {q:"The unit of electric potential is:",opts:["Newton (N)","Coulomb (C)","Farad (F)","Volt (V) = J/C"],ans:3,exp:"Volt (V) = Joule/Coulomb = J/C. It's the energy per unit charge.",ref:"Lec 4 — Units"},
    {q:"Potential V due to multiple point charges uses:",opts:["Vector addition","Cross product","Scalar addition","Only the largest V"],ans:2,exp:"Because V is a SCALAR, you simply add all the potentials algebraically: V_total = V₁ + V₂ + V₃...",ref:"Lec 4 — Superposition"},
    {q:"The reference point for electric potential (V = 0) is typically at:",opts:["The surface of conductors","The center of the charge","Infinity (R = ∞)","The midpoint between charges"],ans:2,exp:"By convention, V = 0 at R = ∞ (infinity). This makes V = Q/(4πε₀R) → 0 as R → ∞.",ref:"Lec 4 — Reference Point"},
    {q:"Moving a positive charge from low to high potential requires:",opts:["No work","Negative work","Positive work (energy input)","Work equals zero"],ans:2,exp:"Moving + charge to higher V: W = Q(V_high - V_low) > 0. You must input energy to push it against the electric force.",ref:"Lec 4 — Work & Energy"}
  ]
},
5:{
  title:"Gauss's Law",
  color:"linear-gradient(90deg,#10b981,#3b82f6)",
  tags:["Gauss","Flux","Symmetry"],
  tagClass:["tag-g","tag-c","tag-b"],
  track:"electricity",
  summary_en:"Gauss's Law: the total electric flux through any closed surface equals the enclosed charge divided by ε₀. Extremely powerful when there is symmetry (spherical, cylindrical, planar). Equivalent to Coulomb's Law but much easier for symmetric distributions.",
  summary_ar:"قانون جاوس: مجموع التدفق الكهربائي عبر أي سطح مغلق يساوي الشحنة المحيطة مقسومة على ε₀. فعّال جداً عند وجود تماثل (كروي، أسطواني، مستوي). مكافئ لقانون كولوم لكن أبسط للتوزيعات المتماثلة.",
  notes:[
    {icon:"🔲",title:"Gauss's Law (Integral Form)",content:"<span class='formula-inline'>∮_S E·dS = Q_enc/ε₀</span><br>• The closed surface is called a GAUSSIAN surface<br>• Choose it to match the symmetry of the problem!<br>• Q_enc = total charge INSIDE the Gaussian surface only"},
    {icon:"📐",title:"Strategy: When to Use Gauss's Law",content:"USE when you have:<br>• <span class='highlight'>Spherical symmetry</span> → spherical Gaussian surface<br>• <span class='highlight'>Cylindrical symmetry</span> → cylindrical Gaussian surface<br>• <span class='highlight'>Planar symmetry</span> → pillbox Gaussian surface<br><span class='warning'>For asymmetric distributions, use Coulomb's Law instead!</span>"},
    {icon:"⚡",title:"Results for Common Geometries",content:"• Point charge at r: <span class='formula-inline'>E = Q/(4πε₀r²)</span><br>• Inside sphere (r < a): <span class='formula-inline'>E = Qr/(4πε₀a³)</span><br>• Infinite line at ρ: <span class='formula-inline'>E = ρ_L/(2πε₀ρ)</span><br>• Infinite plane: <span class='formula-inline'>E = ρ_S/(2ε₀)</span>"},
    {icon:"🔗",title:"Differential Form",content:"<span class='formula-inline'>∇·E = ρ_V/ε₀</span> (Divergence of E = charge density / ε₀)<br>This is one of Maxwell's Equations. ∇·E = 0 in a charge-free region."}
  ],
  formulas:[
    {name:"Gauss's Law (Integral)",eq:"∮_S E·dS = Q_enc/ε₀",desc:"Total electric flux = enclosed charge / ε₀. Applied to a closed Gaussian surface.",vars:["Q_enc = charge enclosed by surface","ε₀ = 8.854×10⁻¹² F/m"]},
    {name:"Electric Flux",eq:"Φ_E = ∮ E·dS = EA·cosθ (for uniform E)",desc:"Total flux through a surface. Positive flux = field leaving surface.",vars:["θ = angle between E and surface normal"]},
    {name:"Gauss's Law (Differential Form)",eq:"∇·E = ρ_V/ε₀",desc:"Differential form — one of Maxwell's equations.",vars:["ρ_V = volume charge density (C/m³)"]},
    {name:"E inside uniformly charged sphere (r < a)",eq:"E = ρ_V·r/(3ε₀) = Q·r/(4πε₀a³)",desc:"Inside a uniform sphere of radius a, E increases linearly with r.",vars:["r = distance from center (r < a)","a = sphere radius"]}
  ],
  mcq:[
    {q:"Gauss's Law states that ∮E·dS equals:",opts:["Q_enc × ε₀","Q_enc / ε₀","E × Volume","Flux × ε₀"],ans:1,exp:"∮E·dS = Q_enc/ε₀. The total outward electric flux through any closed surface = enclosed charge / ε₀.",ref:"Lec 5 — Gauss's Law"},
    {q:"When is Gauss's Law most practically useful?",opts:["For any charge distribution","Only for point charges","When the problem has HIGH symmetry (spherical, cylindrical, planar)","Only for negative charges"],ans:2,exp:"Gauss's Law is ALWAYS true but only EASY to apply when there's high symmetry. With symmetry, E is uniform on the Gaussian surface so ∮E·dS = E × Area.",ref:"Lec 5 — Gauss's Law Application"},
    {q:"The appropriate Gaussian surface for a long wire (cylindrical symmetry) is:",opts:["A sphere","A cylinder coaxial with the wire","A flat plane","A cube"],ans:1,exp:"For a long wire, use a coaxial cylinder. By symmetry, E points radially outward (â_ρ) and is constant on the cylindrical surface.",ref:"Lec 5 — Gaussian Surfaces"},
    {q:"The electric field INSIDE a hollow conducting sphere (no charge inside) is:",opts:["E = Q/(4πε₀r²)","E = uniform","E = 0","E = ρ_V/ε₀"],ans:2,exp:"Inside a closed conducting shell with no enclosed charge, Q_enc = 0, so E = 0 everywhere inside. This is Faraday shielding!",ref:"Lec 5 — Conducting Shell"},
    {q:"Which of the following is the differential form of Gauss's Law?",opts:["∇×E = 0","∇·E = ρ_V/ε₀","∇·B = 0","∇×H = J"],ans:1,exp:"∇·E = ρ_V/ε₀ is the differential form of Gauss's Law. This is one of Maxwell's 4 equations.",ref:"Lec 5 — Maxwell's Equations"},
    {q:"For a uniformly charged sphere of radius a, the E field for r > a is:",opts:["E = 0","E = Q/(4πε₀r²) (same as point charge)","E = Q·r/(4πε₀a³)","E = ρ_V/(3ε₀)"],ans:1,exp:"For r > a: all charge is enclosed. Using spherical Gaussian surface: E = Q/(4πε₀r²) — exactly like a point charge! This is the shell theorem.",ref:"Lec 5 — Charged Sphere"},
    {q:"Electric flux has units of:",opts:["N/C","V·m","N·m²/C","C/m²"],ans:2,exp:"Φ = ∮E·dS. [E] = N/C, [dS] = m². So [Φ] = N·m²/C.",ref:"Lec 5 — Units"},
    {q:"For an infinite plane of charge with surface charge density ρ_S, the E field is:",opts:["E = ρ_S/(ε₀), varies with distance","E = ρ_S/(2ε₀), uniform","E = ρ_S/(4πε₀)","E = 0"],ans:1,exp:"Using a pillbox Gaussian surface: E = ρ_S/(2ε₀). The field is UNIFORM (doesn't depend on distance from the plane).",ref:"Lec 5 — Infinite Sheet"},
    {q:"The Q_enc in Gauss's Law refers to:",opts:["Total charge in the universe","Only positive charges","All charges INSIDE the Gaussian surface","All charges outside"],ans:2,exp:"Q_enc = ONLY the charge inside the Gaussian surface. Charges outside don't contribute to the net flux.",ref:"Lec 5 — Enclosed Charge"},
    {q:"For r < a inside a uniformly charged solid sphere, E is proportional to:",opts:["1/r²","1/r","r (linear)","r²"],ans:2,exp:"Inside uniform sphere: Q_enc = Q_total × (r³/a³). Gauss's Law: E ∝ r. E increases linearly from zero at center to maximum at surface.",ref:"Lec 5 — Inside Sphere"}
  ]
},
6:{
  title:"Capacitance",
  color:"linear-gradient(90deg,#f59e0b,#10b981)",
  tags:["Capacitance","Energy","Dielectric"],
  tagClass:["tag-o","tag-g","tag-p"],
  track:"electricity",
  summary_en:"Capacitance C = Q/V. Measures a conductor system's ability to store charge. Parallel plate: C = ε₀A/d. Spherical: C = 4πε₀ab/(b-a). Energy stored: W = ½CV² = ½Q²/C = ½QV. Dielectrics increase capacitance by factor εᵣ.",
  summary_ar:"السعة C = Q/V. تقيس قدرة نظام الموصلات على تخزين الشحنة. المتوازي الصفيحتين: C = ε₀A/d. الكروي: C = 4πε₀ab/(b-a). الطاقة المخزنة: W = ½CV². العوازل تزيد السعة بعامل εᵣ.",
  notes:[
    {icon:"🔌",title:"Capacitance Definition",content:"<span class='formula-inline'>C = Q/V</span><br>• Unit: Farad (F) = C/V<br>• C depends ONLY on geometry and material (not Q or V)<br>• Larger C = more charge stored per volt<br>• For exam: Capacitance = charge per unit potential difference"},
    {icon:"📐",title:"Common Capacitor Types",content:"• <span class='highlight'>Parallel plate:</span> C = ε₀εᵣA/d<br>• <span class='highlight'>Spherical:</span> C = 4πε₀εᵣab/(b-a)<br>• <span class='highlight'>Cylindrical:</span> C = 2πε₀εᵣL/ln(b/a)"},
    {icon:"⚡",title:"Energy Stored",content:"<span class='formula-inline'>W = ½CV² = Q²/(2C) = ½QV</span><br>All three forms are equivalent — use whichever is convenient."},
    {icon:"🔑",title:"Dielectric Effect",content:"Inserting dielectric εᵣ between plates:<br>• C increases by factor εᵣ: <span class='formula-inline'>C = εᵣ × C₀</span><br>• E field decreases: E = E₀/εᵣ<br>• <span class='warning'>Midterm: Questions 1,2,3,18,19,20 are from this lecture!</span>"}
  ],
  formulas:[
    {name:"Capacitance",eq:"C = Q/V",desc:"Charge stored per unit potential difference. Unit: Farad (F).",vars:["Q = charge on one plate (C)","V = potential difference (V)"]},
    {name:"Parallel Plate Capacitor",eq:"C = ε₀εᵣA/d",desc:"Most common type. Uniform E field between plates.",vars:["A = plate area (m²)","d = separation (m)","εᵣ = relative permittivity"]},
    {name:"Spherical Capacitor",eq:"C = 4πε₀εᵣab/(b-a)",desc:"Inner sphere radius a, outer sphere radius b.",vars:["a = inner radius","b = outer radius"]},
    {name:"Cylindrical Capacitor",eq:"C = 2πε₀εᵣL/ln(b/a)",desc:"Length L, inner radius a, outer radius b.",vars:[]},
    {name:"Energy Stored",eq:"W = ½CV² = Q²/(2C) = ½QV",desc:"All three forms give same result.",vars:[]},
    {name:"Capacitors in Series",eq:"1/C_eq = 1/C₁ + 1/C₂ + ...",desc:"Series connection: same Q, voltages add.",vars:[]},
    {name:"Capacitors in Parallel",eq:"C_eq = C₁ + C₂ + ...",desc:"Parallel connection: same V, charges add.",vars:[]}
  ],
  mcq:[
    {q:"Capacitance is defined as:",opts:["Charge per unit electric field","Charge stored per unit potential difference (C = Q/V)","Voltage per unit charge","Energy per unit charge"],ans:1,exp:"C = Q/V (charge per unit potential difference). Unit: Farad (F) = Coulomb/Volt. From Midterm Q18.",ref:"Lec 6 — Capacitance Definition (Midterm Q18)"},
    {q:"The SI unit of capacitance is:",opts:["Henry (H)","Volt (V)","Coulomb (C)","Farad (F)"],ans:3,exp:"Farad (F) = C/V. Note: Henry (H) is unit of INDUCTANCE. From Midterm Q19.",ref:"Lec 6 — Units (Midterm Q19)"},
    {q:"Capacitance increases when the plate area:",opts:["Decreases","Becomes zero","Increases","Stays unchanged"],ans:2,exp:"C = ε₀A/d → C ∝ A. Larger plate area → more charge stored at same voltage. From Midterm Q20.",ref:"Lec 6 — Parallel Plate (Midterm Q20)"},
    {q:"For a parallel plate capacitor with dielectric εᵣ = 4, the capacitance compared to vacuum is:",opts:["Same","4 times smaller","4 times larger","16 times larger"],ans:2,exp:"C = εᵣ × C₀ = 4 × C₀. Dielectric increases capacitance by factor εᵣ.",ref:"Lec 6 — Dielectrics"},
    {q:"Two capacitors C₁ = 3F and C₂ = 6F in SERIES. Equivalent capacitance:",opts:["9F","2F","3F","0.5F"],ans:1,exp:"1/C_eq = 1/3 + 1/6 = 2/6 + 1/6 = 3/6 = 1/2. C_eq = 2F. Series: smaller than the smallest.",ref:"Lec 6 — Series Capacitors (Midterm Q1 style)"},
    {q:"For a spherical capacitor (inner radius a, outer radius b), the capacitance is:",opts:["C = 4πε₀(b-a)/(ab)","C = 4πε₀ab/(b-a)","C = 4πε₀a","C = 2πε₀/ln(b/a)"],ans:1,exp:"C = 4πε₀ab/(b-a). From Midterm Q2.",ref:"Lec 6 — Spherical Capacitor (Midterm Q2)"},
    {q:"Energy stored in a capacitor can be expressed as:",opts:["W = CV","W = ½CV²","W = 2CV²","W = QV"],ans:1,exp:"W = ½CV² = Q²/(2C) = ½QV. All three are equivalent. The ½ factor comes from integrating as you charge the capacitor.",ref:"Lec 6 — Energy"},
    {q:"Two dielectric wedges in a spherical capacitor result in:",opts:["One capacitor only","Two capacitors in PARALLEL","Two capacitors in series then parallel","Two capacitors in series"],ans:1,exp:"From Midterm Q1: Two dielectric wedges sharing the same voltage (same inner/outer spheres) → PARALLEL combination.",ref:"Lec 6 — Dielectric Wedges (Midterm Q1)"},
    {q:"When capacitor plate separation d is halved, capacitance:",opts:["Halves","Doubles","Stays same","Quadruples"],ans:1,exp:"C = ε₀A/d. If d → d/2, then C → ε₀A/(d/2) = 2C. Capacitance DOUBLES. Bringing plates closer stores more charge.",ref:"Lec 6 — Parallel Plate"},
    {q:"For a two-dielectric spherical capacitor with εᵣ₁ for 0<φ<π/2 and εᵣ₂ for π/2<φ<2π, total capacitance C is:",opts:["C₁ in series with C₂","C₁ + C₂ (parallel)","Average C","Only C₁ (dominant)"],ans:1,exp:"The two wedges share the SAME voltage → PARALLEL. C_total = C₁ + C₂. This was exactly Midterm Q1 and Q3!",ref:"Lec 6 — Midterm Q1,Q3"}
  ]
},
7:{
  title:"Magnetic Field",
  color:"linear-gradient(90deg,#8b5cf6,#ec4899)",
  tags:["Biot-Savart","B-Field","Lorentz Force"],
  tagClass:["tag-p","tag-b","tag-c"],
  track:"magnetism",
  summary_en:"Magnetic field B is produced by moving charges or currents. Biot-Savart Law gives B due to current element. Force on moving charge: F = qv×B (Lorentz). Force on current: F = IL×B. Circular arc at center: B = μ₀Iθ/(4πR).",
  summary_ar:"المجال المغناطيسي B ينتج عن الشحنات المتحركة أو التيارات. قانون بيو-سافار يعطي B بسبب عنصر تيار. القوة على شحنة متحركة: F = qv×B (لورنتز). القوة على تيار: F = IL×B.",
  notes:[
    {icon:"🧲",title:"Biot-Savart Law",content:"<span class='formula-inline'>dB = μ₀I(dl × â_R)/(4πR²)</span><br>• Used when Ampere's Law can't be applied (no symmetry)<br>• For circular arc of angle θ at center: <span class='formula-inline'>B = μ₀Iθ/(4πR)</span><br>• For full circle (θ=2π): <span class='formula-inline'>B = μ₀I/(2R)</span>"},
    {icon:"⚡",title:"Lorentz Force",content:"Force on moving charge: <span class='formula-inline'>F = qv×B</span><br>Force on current-carrying conductor: <span class='formula-inline'>F = IL×B</span><br>• If v is parallel to B: F = 0 (no force!)"},

  summary_ar:"قانون فاراداي: EMF = -dΦ_B/dt. التدفق المغناطيسي المتغير يولّد قوة دافعة كهربائية. قانون لينز يعطي الاتجاه: التيار المحث يعارض التغيير. القوة الدافعة الحركية: ε = Bvl.",
  notes:[
    {icon:"⚡",title:"Faraday's Law",content:"<span class='formula-inline'>EMF = -dΦ_B/dt = -d/dt ∫B·dS</span><br>• Φ_B = magnetic flux (Wb = T·m²)<br>• Negative sign → Lenz's Law<br>• For N-turn coil: EMF = -N dΦ_B/dt"},
    {icon:"🔄",title:"Lenz's Law",content:"The induced current flows in a direction such that its B field OPPOSES the change in flux that caused it.<br>• Flux increasing → induced B opposes → induced current counterclockwise"},
    {icon:"🏃",title:"Motional EMF",content:"EMF from a conductor moving in B field:<br><span class='formula-inline'>ε = Bvl</span> (for straight conductor, v⊥B)<br>This is the principle behind electric generators!"},
    {icon:"🔋",title:"Self-Inductance",content:"<span class='formula-inline'>L = NΦ_B/I</span><br><span class='formula-inline'>V_L = -L dI/dt</span> (voltage across inductor)<br>Unit: Henry (H)<br>For solenoid: L = μ₀N²A/l"}
  ],
  formulas:[

    {name:"Magnetic Flux",eq:"Φ_B = ∫B·dS = BA·cosθ (uniform B)",desc:"Total flux through a surface.",vars:["θ = angle between B and surface normal"]},
    {name:"Motional EMF",eq:"ε = Bvl",desc:"EMF from straight conductor of length l moving at v perpendicular to B.",vars:[]},
    {name:"Self-Inductance",eq:"L = NΦ/I",desc:"Self-inductance L. Unit: Henry (H).",vars:[]},

  mcq:[

    {q:"The unit of magnetic flux is:",opts:["Tesla (T)","Ampere (A)","Weber (Wb) = T·m²","Henry (H)"],ans:2,exp:"Magnetic flux Φ = B·A has units T·m² = Weber (Wb).",ref:"Lec 9 — Flux Units"},
    {q:"Lenz's Law states that the induced current:",opts:["Is always clockwise","Maximizes the flux change","Opposes the change in flux that caused it","Is in the same direction as the original current"],ans:2,exp:"Lenz's Law: induced current creates a magnetic field that OPPOSES the change in flux.",ref:"Lec 9 — Lenz's Law"},
    {q:"A straight conductor of length l moves with velocity v perpendicular to B field. The motional EMF is:",opts:["ε = B²vl","ε = Bvl","ε = Bv/l","ε = Bv²l"],ans:1,exp:"ε = Bvl when v ⊥ B and l ⊥ both. This is the generator principle.",ref:"Lec 9 — Motional EMF"},
    {q:"If magnetic flux through a loop is Φ = 3t² + 2t Wb, the induced EMF at t = 2s is:",opts:["16 V","14 V","10 V","28 V"],ans:1,exp:"EMF = -dΦ/dt = -(6t + 2). At t=2: EMF = -(12+2) = -14V. Magnitude = 14V.",ref:"Lec 9 — Faraday's Law Calculation"},
    {q:"Self-inductance L of a coil is defined as:",opts:["L = V/I","L = NΦ/I","L = N²/R","L = μ₀N²"],ans:1,exp:"L = NΦ/I (flux linkage per unit current). Unit: Henry (H).",ref:"Lec 9 — Self-Inductance"},
    {q:"The voltage across an inductor L when current changes is:",opts:["V = LI","V = L·dI/dt","V = -L·dI/dt","V = L/I"],ans:2,exp:"V_L = -L(dI/dt). Negative sign: inductor OPPOSES current change (back-EMF).",ref:"Lec 9 — Inductor Voltage"},
    {q:"The self-inductance of a solenoid with N turns, area A, and length ℓ is:",opts:["L = μ₀N²A","L = μ₀N²A/ℓ","L = μ₀NA/ℓ","L = μ₀N²/ℓ"],ans:1,exp:"L = μ₀N²A/ℓ = μ₀n²ℓA. Derived from flux: Φ = BA = μ₀nIA, L = NΦ/I.",ref:"Lec 9 — Solenoid Inductance"},
    {q:"Which of Maxwell's equations represents Faraday's Law?",opts:["∇·E = ρ/ε₀","∇·B = 0","∇×E = -∂B/∂t","∇×H = J + ∂D/∂t"],ans:2,exp:"∇×E = -∂B/∂t is Faraday's Law in differential form. The curl of E equals the negative rate of change of B.",ref:"Lec 9 — Maxwell's Equations"},

10:{
  title:"Induction + Maxwell & Boundary Conditions",

  notes:[

    {icon:"🔲",title:"Boundary Conditions",content:"At interface between medium 1 and medium 2:<br>• <span class='highlight'>Normal D:</span> D₁n - D₂n = ρ_S<br>• <span class='highlight'>Normal B:</span> B₁n = B₂n (continuous)<br>• <span class='highlight'>Tangential E:</span> E₁t = E₂t (continuous)<br>• <span class='highlight'>Tangential H:</span> H₁t - H₂t = K"},
    {icon:"⚡",title:"Displacement Current (Maxwell's Addition)",content:"Maxwell added <span class='formula-inline'>J_d = ∂D/∂t</span> to Ampere's Law.<br>This was the key insight that led to electromagnetic WAVES."}
  ],
  formulas:[

    {name:"Maxwell Eq. 4 — Ampere-Maxwell",eq:"∇×H = J + ∂D/∂t  |  ∮H·dl = I_enc + dΦ_D/dt",desc:"Current + changing E creates B.",vars:[]},
    {name:"Boundary — Normal B",eq:"B₁ₙ = B₂ₙ  (B_n is continuous)",desc:"Normal component of B is continuous.",vars:[]},
    {name:"Boundary — Tangential E",eq:"E₁ₜ = E₂ₜ  (E_t is continuous)",desc:"Tangential component of E is continuous.",vars:[]},
    {name:"Boundary — Normal D",eq:"D₁ₙ - D₂ₙ = ρ_S",desc:"Discontinuity in normal D = surface charge density.",vars:[]},
    {name:"Boundary — Tangential H",eq:"H₁ₜ - H₂ₜ = K × â_n",desc:"Discontinuity in tangential H = surface current density K.",vars:[]}

  mcq:[

    {q:"Maxwell added the displacement current term ∂D/∂t to:",opts:["Faraday's Law","Gauss's Law","Ampere's Law","The continuity equation"],ans:2,exp:"Maxwell added J_d = ∂D/∂t to Ampere's Law: ∇×H = J + ∂D/∂t. This addition predicted electromagnetic waves!",ref:"Lec 10 — Displacement Current"},
    {q:"The boundary condition for tangential E at an interface is:",opts:["E₁t - E₂t = ρ_S/ε","E₁t = E₂t (continuous)","E₁t + E₂t = 0","E₁t = -E₂t"],ans:1,exp:"Tangential E is CONTINUOUS: E₁t = E₂t. This comes from ∮E·dl = 0 for static case.",ref:"Lec 10 — Boundary Conditions"},

// STATE MANAGEMENT (LocalStorage)
// ════════════════════════════════════════════
const STORE = {
  get(k){try{return JSON.parse(localStorage.getItem('phy2_'+k))}catch{return null}},
  set(k,v){try{localStorage.setItem('phy2_'+k,JSON.stringify(v))}catch{}},
  getCompleted(){return this.get('completed')||[]},
  setCompleted(arr){this.set('completed',arr)},
  getQuizScores(){return this.get('quiz_scores')||{}},
  setQuizScore(n,score){const s=this.getQuizScores();s[n]=score;this.set('quiz_scores',s)},
  getMidtermScore(){return this.get('midterm_score')},
  setMidtermScore(s){this.set('midterm_score',s)},
  getFinalScore(){return this.get('final_score')},
  setFinalScore(s){this.set('final_score',s)}
};

function markLectureDone(n){
  const done = STORE.getCompleted();
  if(!done.includes(n)){done.push(n);STORE.setCompleted(done);}
  updateProgressUI();
  updateNavDone();
  showToast('✅ Lecture '+n+' marked as complete!');
}

function isLectureDone(n){return STORE.getCompleted().includes(n)}

function updateProgressUI(){
  const done = STORE.getCompleted().length;
  const total = 10;
  const pct = Math.round(done/total*100);
  const fillEl = document.getElementById('sp-fill');
  const pctEl = document.getElementById('sp-pct');
  if(fillEl) fillEl.style.width = pct+'%';
  if(pctEl) pctEl.textContent = pct+'%';
}

function updateNavDone(){
  for(let n=1;n<=10;n++){
    const el = document.getElementById('done-'+n);
    if(el) el.textContent = isLectureDone(n) ? '✓' : '';
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// SEARCH SYSTEM
// ════════════════════════════════════════════
function handleSearch(q){
  const dd = document.getElementById('search-dropdown');
  if(!q||q.length < 2){dd.innerHTML='';dd.classList.remove('open');return;}
  const results=[];
  const ql = q.toLowerCase();
  // Search lectures
  Object.entries(LECTURES).forEach(([n,lec])=>{
    if(lec.title.toLowerCase().includes(ql)||lec.summary_en.toLowerCase().includes(ql)||lec.tags.some(t=>t.toLowerCase().includes(ql))){
      results.push({type:'Lecture',text:`Lec ${n} — ${lec.title}`,action:`showLec(${n})`});
    }
    // Search formulas
    lec.formulas.forEach(f=>{
      if(f.name.toLowerCase().includes(ql)||f.eq.toLowerCase().includes(ql)||f.desc.toLowerCase().includes(ql)){
        results.push({type:'Formula',text:`${f.name}: ${f.eq}`,action:`showLec(${n});setTimeout(()=>{const fb=document.querySelector('[onclick*="formulas"]');if(fb)fb.click()},200)`});
      }
    });
  });
  if(results.length===0){dd.innerHTML='<div class="sr-empty">No results found</div>';dd.classList.add('open');return;}
  dd.innerHTML = results.slice(0,8).map(r=>`<div class="sr-item" onclick="${r.action};document.getElementById('global-search').value='';document.getElementById('search-dropdown').classList.remove('open');closeSidebar()"><span class="sr-type">${r.type}</span>${r.text}</div>`).join('');
  dd.classList.add('open');
}

// Close search on outside click
document.addEventListener('click',e=>{
  if(!e.target.closest('.sidebar-search'))document.getElementById('search-dropdown').classList.remove('open');
});

  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(id==='home'){
    document.getElementById('nav-home').classList.add('active');
    document.getElementById('topbar-title').textContent='Physics II — Dashboard';
    document.getElementById('topbar-badge').textContent='HNU · ISE';
    renderHome();
  } else if(id==='exams'){
    document.getElementById('nav-exams').classList.add('active');
    document.getElementById('topbar-title').textContent='Exams — Midterm & Final';
    document.getElementById('topbar-badge').textContent='Model Answers';
    renderExamsHub();
  }
  closeSidebar();
}

function showLec(n){
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  const nav=document.getElementById('nav-'+n);
  if(nav) nav.classList.add('active');
  const lec=LECTURES[n];
  document.getElementById('topbar-title').textContent=`Lec ${n} — ${lec.title}`;
  document.getElementById('topbar-badge').textContent=lec.track==='electricity'?'⚡ Electricity':'🧲 Magnetism';
  answers={}; submitted=false;
  renderLecture(n);
  closeSidebar();
  document.getElementById('main-content').scrollTop=0;
  window.scrollTo(0,0);
}

        ${q.opts.map((opt,j)=>`

          </button>`).join('')}
      </div>

    </div>`).join('')}
    <div class="quiz-btns" id="quiz-btns-${n}">
      <button class="submit-btn" onclick="submitQuiz(${n})">✓ Submit Quiz</button>
      <button class="reset-btn" onclick="resetQuiz(${n})">↺ Reset</button>
    </div>
    <div id="result-${n}"></div><div style="height:24px"></div>`;

function selectAns(n,qi,ai){
  if(submitted) return;
  answers[qi]=ai;
  document.querySelectorAll(`[id^="qopt-${n}-${qi}-"]`).forEach(b=>{b.style.borderColor='';b.style.background='';b.style.color='';});
  const btn=document.getElementById(`qopt-${n}-${qi}-${ai}`);
  if(btn){btn.style.borderColor='#3b82f6';btn.style.background='#101d30';btn.style.color='#fff';}
}

function submitQuiz(n){
  submitted=true;
  let score=0;
  const lec=LECTURES[n];
  lec.mcq.forEach((q,i)=>{
    const chosen=answers[i];
    q.opts.forEach((_,j)=>{
      const btn=document.getElementById(`qopt-${n}-${i}-${j}`);
      if(btn){
        btn.disabled=true;btn.style.borderColor='';btn.style.background='';btn.style.color='';
        if(j===q.ans) btn.classList.add('correct');
        else if(j===chosen&&chosen!==q.ans) btn.classList.add('wrong');
      }
    });
    const expEl=document.getElementById(`exp-${n}-${i}`);
    if(expEl){
      const correct=chosen===q.ans;
      if(correct) score++;
      expEl.className=`explanation show ${correct?'exp-correct':'exp-wrong'}`;
      expEl.innerHTML=`<strong>${correct?'✓ Correct!':'✗ Wrong! Correct: '+q.opts[q.ans]}</strong> ${q.exp}${q.ref?`<div class="exp-ref">📚 ${q.ref}</div>`:''}`;
    }
  });
  const sub=document.querySelector(`#quiz-btns-${n} .submit-btn`);
  if(sub) sub.style.display='none';
  STORE.setQuizScore(n,score);
  const pct=Math.round(score/10*100);
  const rating=pct>=80?'🏆 Excellent!':pct>=60?'✅ Good':pct>=40?'📚 Keep Studying':'⚠️ Review Needed';
  const color=pct>=80?'#10b981':pct>=60?'#3b82f6':pct>=40?'#f59e0b':'#ef4444';
  document.getElementById(`result-${n}`).innerHTML=`<div class="result-card"><div class="result-score" style="color:${color}">${score}/10</div><div class="result-label">${pct}% Score</div><div class="result-rating">${rating}</div></div>`;
  showToast(`Quiz done! Score: ${score}/10`);
}

function resetQuiz(n){
  answers={};submitted=false;
  document.getElementById('tab-practice').innerHTML=renderPractice(n);
}

// EXAM RENDER (Midterm + Final with Timer)
// ════════════════════════════════════════════
let examAnswers={}, examSubmitted=false, examTimer=null, examTimeLeft=0, currentExamType='midterm';

function renderExam(type){
  currentExamType = type;
  examAnswers={}; examSubmitted=false;
  clearInterval(examTimer);
  const isMidterm = type==='midterm';
  const questions = isMidterm ? MIDTERM_QUESTIONS : FINAL_QUESTIONS;
  const timeLimit = isMidterm ? 60*60 : 120*60;
  const savedScore = isMidterm ? STORE.getMidtermScore() : STORE.getFinalScore();
  examTimeLeft = timeLimit;
  const el=document.getElementById('main-content');
  const examLabel = isMidterm ? 'Midterm Exam — Model A' : 'Final Exam — Model A';
  const topicNote = isMidterm
    ? 'Topics: Capacitance (Lec 6) + Magnetic Field (Lec 7) + Ampere\'s Law (Lec 8)'
    : 'Topics: All 10 Lectures — Full Comprehensive Exam';
  el.innerHTML=`
    <button class="back-btn" onclick="clearInterval(examTimer);renderExamsHub()">← Back to Exams</button>
    <div class="hero">
      <div class="hero-title">📝 ${examLabel}</div>
      <div class="hero-sub">Faculty of Engineering · ISE · Spring 2025-2026 · Dr. Amany Mohamed Saleh<br>${topicNote}<br>
      <span style="color:#fbbf24">ε₀ = 8.854×10⁻¹² F/m &nbsp;|&nbsp; μ₀ = 4π×10⁻⁷ H/m</span></div>
    </div>
    <div class="exam-badge">⭐ ${isMidterm?'Actual Midterm':'Final Exam'} — All ${questions.length} Questions</div>
    ${savedScore!==null&&savedScore!==undefined?`<div style="font-size:12px;color:#94a3b8;margin-bottom:10px">📊 Your best score: <strong style="color:#10b981">${savedScore}/${questions.length}</strong></div>`:''}
    <div class="exam-timer-bar" id="exam-timer-bar">
      <div>
        <div style="font-size:10px;color:#f59e0b;font-weight:700;margin-bottom:2px">⏱ TIME REMAINING</div>
        <div class="exam-timer-display" id="exam-timer-display">${formatTime(timeLimit)}</div>
      </div>
      <div class="exam-progress-info">
        <span id="exam-answered">0/${questions.length} answered</span>
        <span id="exam-time-note">${isMidterm?'60 minutes':'120 minutes'}</span>
      </div>
    </div>
    ${questions.map((q,i)=>`
    <div class="q-card" id="eqcard-${i}">
      <div class="q-num">Q${q.num} · <span style="color:#f59e0b">${q.topic}</span></div>
      <div class="q-text">${q.q}</div>
      <div class="q-options">
        ${q.opts.map((opt,j)=>`
          <button class="q-opt" id="eqopt-${i}-${j}" onclick="selectExamAns(${i},${j})">
            <span class="opt-letter">${['a','b','c','d'][j]}</span>${opt}
          </button>`).join('')}
      </div>
      <div class="explanation" id="eexp-${i}"></div>
    </div>`).join('')}
    <div class="quiz-btns" id="exam-btns">
      <button class="submit-btn" onclick="submitExam('${type}')">✓ Submit Exam</button>
      <button class="reset-btn" onclick="clearInterval(examTimer);renderExam('${type}')">↺ Reset</button>
    </div>
    <div id="exam-result"></div>
    <div id="exam-review"></div>
    <div style="height:24px"></div>`;
  startExamTimer(type);
}

function formatTime(seconds){
  const m=Math.floor(seconds/60).toString().padStart(2,'0');
  const s=(seconds%60).toString().padStart(2,'0');
  return m+':'+s;
}

function startExamTimer(type){
  clearInterval(examTimer);
  examTimer=setInterval(()=>{
    if(examSubmitted){clearInterval(examTimer);return;}
    examTimeLeft--;
    const disp=document.getElementById('exam-timer-display');
    if(disp){
      disp.textContent=formatTime(examTimeLeft);
      if(examTimeLeft<=300) disp.classList.add('warning');
      else disp.classList.remove('warning');
    }
    if(examTimeLeft<=0){clearInterval(examTimer);submitExam(type);}
  },1000);
}

function selectExamAns(qi,ai){
  if(examSubmitted) return;
  examAnswers[qi]=ai;
  document.querySelectorAll(`[id^="eqopt-${qi}-"]`).forEach(b=>{b.style.borderColor='';b.style.background='';b.style.color='';});
  const btn=document.getElementById(`eqopt-${qi}-${ai}`);
  if(btn){btn.style.borderColor='#3b82f6';btn.style.background='#101d30';btn.style.color='#fff';}
  const answered=Object.keys(examAnswers).length;
  const questions=currentExamType==='midterm'?MIDTERM_QUESTIONS:FINAL_QUESTIONS;
  const info=document.getElementById('exam-answered');
  if(info) info.textContent=`${answered}/${questions.length} answered`;
}

function submitExam(type){
  examSubmitted=true;
  clearInterval(examTimer);
  const questions=type==='midterm'?MIDTERM_QUESTIONS:FINAL_QUESTIONS;
  let score=0;
  questions.forEach((q,i)=>{
    const chosen=examAnswers[i];
    q.opts.forEach((_,j)=>{
      const btn=document.getElementById(`eqopt-${i}-${j}`);
      if(btn){
        btn.disabled=true;btn.style.borderColor='';btn.style.background='';btn.style.color='';
        if(j===q.ans) btn.classList.add('correct');
        else if(j===chosen&&chosen!==q.ans) btn.classList.add('wrong');
      }
    });
    const expEl=document.getElementById(`eexp-${i}`);
    if(expEl){
      const correct=chosen===q.ans;
      if(correct) score++;
      expEl.className=`explanation show ${correct?'exp-correct':'exp-wrong'}`;
      expEl.innerHTML=`<strong>${correct?'✓ Correct!':'✗ Wrong! Correct: '+q.opts[q.ans]}</strong><br>${q.exp}<br><strong style="color:#fbbf24;margin-top:4px;display:block">${q.ans_detail}</strong>`;
    }
  });
  const sub=document.getElementById('exam-btns');
  if(sub){const s=sub.querySelector('.submit-btn');if(s)s.style.display='none';}
  // Save score
  if(type==='midterm') STORE.setMidtermScore(score);
  else STORE.setFinalScore(score);
  const pct=Math.round(score/questions.length*100);
  const rating=pct>=80?'🏆 Excellent!':pct>=60?'✅ Good Pass':pct>=40?'📚 Need More Study':'⚠️ Review All Topics';
  const color=pct>=80?'#10b981':pct>=60?'#3b82f6':pct>=40?'#f59e0b':'#ef4444';
  document.getElementById('exam-result').innerHTML=`
    <div class="result-card">
      <div class="result-score" style="color:${color}">${score}/${questions.length}</div>
      <div class="result-label">${pct}% Score · Time Used: ${formatTime((type==='midterm'?3600:7200)-examTimeLeft)}</div>
      <div class="result-rating">${rating}</div>
    </div>`;
  // Answer Review section
  renderAnswerReview(questions);
  showToast(`Exam submitted! Score: ${score}/${questions.length}`);
}

function renderAnswerReview(questions){
  const reviewEl=document.getElementById('exam-review');
  if(!reviewEl) return;
  const correctCount=questions.filter((_,i)=>examAnswers[i]===questions[i].ans).length;
  const wrongCount=questions.filter((_,i)=>examAnswers[i]!==undefined&&examAnswers[i]!==questions[i].ans).length;
  const unanswered=questions.filter((_,i)=>examAnswers[i]===undefined).length;
  reviewEl.innerHTML=`
    <div class="review-section">
      <div class="review-header">📋 Full Answer Review — Model Answers & Explanations
        <span style="margin-left:auto;font-size:12px;font-weight:400;color:#94a3b8">✅ ${correctCount} correct &nbsp; ❌ ${wrongCount} wrong &nbsp; ⬜ ${unanswered} unanswered</span>
      </div>
      ${questions.map((q,i)=>{
        const chosen=examAnswers[i];
        const correct=chosen===q.ans;
        const unansweredQ=chosen===undefined;
        return `<div class="review-q ${unansweredQ?'':correct?'correct-q':'wrong-q'}">
          <div class="review-q-num">
            Q${q.num} · <span style="color:#94a3b8">${q.topic}</span>
            <span class="review-badge ${unansweredQ?'rb-unanswered':correct?'rb-correct':'rb-wrong'}">
              ${unansweredQ?'⬜ Unanswered':correct?'✅ Correct':'❌ Wrong'}
            </span>
          </div>
          <div class="review-q-text">${q.q}</div>
          ${chosen!==undefined&&!correct?`<div class="review-answer ra-your">Your answer: ${['a','b','c','d'][chosen]}) ${q.opts[chosen]}</div>`:''}
          <div class="review-answer ra-correct">✅ Correct answer: ${['a','b','c','d'][q.ans]}) ${q.opts[q.ans]}</div>
          <div class="review-answer ${correct?'ra-explain':'ra-explain wrong-exp'}">${q.exp}<br><strong>${q.ans_detail}</strong></div>
        </div>`;
      }).join('')}
    </div>`;
}

  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');

  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

updateProgressUI();
updateNavDone();
renderHome();
