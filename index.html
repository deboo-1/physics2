<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics II — HNU Study Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   PHYSICS II STUDY PLATFORM — ENHANCED & FIXED v8
   HNU · ISE · Spring 2025-2026
═══════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090f;--surface:#0d1117;--card:#111827;--card2:#0f1923;--border:#1f2d3d;
  --blue:#3b82f6;--cyan:#06b6d4;--green:#10b981;--purple:#8b5cf6;
  --orange:#f59e0b;--red:#ef4444;--text:#f0f4f8;--muted:#64748b;
  --accent:#3b82f6;--radius:12px;
}

body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.65}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh}
.sidebar{width:290px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s ease;scrollbar-width:thin;scrollbar-color:#1f2d3d transparent}
.main{margin-left:290px;flex:1;min-height:100vh;display:flex;flex-direction:column}

@media(max-width:992px){
  .sidebar{transform:translateX(-290px)}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0}.menu-btn{display:flex!important}
}

/* ── SIDEBAR ── */
.brand{padding:22px 18px 16px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#080f1a,#0d1b2a)}
.brand-icon{font-size:24px;margin-bottom:6px}
.brand-title{font-size:16px;font-weight:700;background:linear-gradient(90deg,#60a5fa,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.55}

/* Progress bar in sidebar */
.sidebar-progress{padding:12px 14px;border-bottom:1px solid var(--border);background:#080d14}
.sp-label{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px}
.sp-label strong{color:#60a5fa}
.sp-bar{height:6px;background:#1e2d40;border-radius:4px;overflow:hidden}
.sp-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#06b6d4);border-radius:4px;transition:width .5s ease}

/* Search in sidebar */
.sidebar-search{padding:12px 14px;border-bottom:1px solid var(--border)}
.search-input-wrap{position:relative}
.search-input-wrap input{width:100%;padding:9px 12px 9px 34px;background:#080d14;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border .2s}
.search-input-wrap input:focus{border-color:#3b82f6}
.search-input-wrap input::placeholder{color:#4b5563}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;color:#4b5563;pointer-events:none}
.search-results-dropdown{position:absolute;top:calc(100% + 4px);left:14px;right:14px;background:#0d1117;border:1px solid #1e3a5f;border-radius:8px;max-height:240px;overflow-y:auto;z-index:200;display:none;box-shadow:0 10px 25px rgba(0,0,0,0.5)}
.search-results-dropdown.open{display:block}
.sr-item{padding:10px 14px;font-size:12.5px;cursor:pointer;border-bottom:1px solid #111827;transition:background .1s;color:#94a3b8}
.sr-item:hover{background:#1e2d40;color:var(--text)}
.sr-item .sr-type{font-size:10px;color:#3b82f6;font-weight:600;display:block;margin-bottom:2px;text-transform:uppercase}
.sr-item:last-child{border-bottom:none}
.sr-empty{padding:12px;font-size:12.5px;color:var(--muted);text-align:center}

.lang-toggle{margin:12px 12px 6px;background:#080d14;border:1px solid var(--border);border-radius:8px;padding:5px;display:flex;gap:4px}
.lang-btn{flex:1;padding:6px 4px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);transition:all .15s;font-family:'Cairo','IBM Plex Sans',sans-serif}
.lang-btn.active{background:#1d3557;color:#60a5fa}

.nav-section{padding:14px 16px 6px;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:#94a3b8;transition:all .15s;margin:2px 10px;border:none;background:none;width:calc(100% - 20px);text-align:left;position:relative}
.nav-item:hover{background:#1a2740;color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,#1d3557,#192a44);color:#60a5fa;border-left:3px solid var(--blue)}
.nav-item .icon{width:20px;font-size:14px;text-align:center;flex-shrink:0}
.nav-item .lec-num{font-size:10px;background:#1e3a5f;color:#60a5fa;padding:1px 5px;border-radius:4px;font-family:'IBM Plex Mono',monospace;margin-left:auto}
.nav-badge{margin-left:auto;font-size:11px;padding:2px 7px;border-radius:10px;background:#1e3a5f;color:#60a5fa}
.nav-done{margin-left:6px;font-size:12px;color:#10b981;font-weight:bold}

/* ── TOP BAR ── */
.topbar{height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:50}
.menu-btn{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:6px;align-items:center;justify-content:center}
.topbar-title{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-badge{padding:4px 12px;border-radius:20px;font-size:11.5px;font-weight:600;background:#1d3557;color:#60a5fa;white-space:nowrap}

/* ── CONTENT ── */
.content{padding:24px;flex:1;max-width:1040px;margin:0 auto;width:100%}
@media(max-width:600px){.content{padding:16px}}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,#0b1520,#142035);border:1px solid #1e3a5f;border-radius:14px;padding:26px;margin-bottom:24px;position:relative;overflow:hidden}
.hero::before{content:'⚡';position:absolute;right:18px;top:8px;font-size:95px;opacity:.04;pointer-events:none}
.hero-title{font-size:24px;font-weight:700;background:linear-gradient(90deg,#60a5fa,#22d3ee,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;line-height:1.3}
.hero-sub{font-size:13.5px;color:#94a3b8;line-height:1.75}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;transition:border-color .2s}
.stat:hover{border-color:#1e3a5f}
.stat-n{font-size:28px;font-weight:700;color:#3b82f6;font-family:'IBM Plex Mono',monospace}
.stat-l{font-size:11.5px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.03em}
.stat-n.green{color:#10b981}.stat-n.purple{color:#a78bfa}.stat-n.orange{color:#f59e0b}

/* ── PROGRESS HOME ── */
.progress-home{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:24px}
.ph-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ph-title{font-size:14px;font-weight:700;color:#60a5fa}
.ph-pct{font-size:22px;font-weight:700;color:#10b981;font-family:'IBM Plex Mono',monospace}
.ph-bar{height:10px;background:#1e2d40;border-radius:8px;overflow:hidden;margin-bottom:12px}
.ph-fill{height:100%;background:linear-gradient(90deg,#10b981,#3b82f6);border-radius:8px;transition:width .6s ease}
.ph-info{font-size:12.5px;color:var(--muted);display:flex;gap:20px;flex-wrap:wrap}
.ph-info span{display:flex;align-items:center;gap:6px}

/* ── SECTION TITLE ── */
.section-title{font-size:15px;font-weight:700;margin:28px 0 14px;display:flex;align-items:center;gap:10px;color:var(--text)}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

/* ── LECTURE GRID ── */
.lec-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px}
@media(max-width:768px){.lec-grid{grid-template-columns:1fr}}
.lec-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .25s ease;position:relative;overflow:hidden}
.lec-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--lc,linear-gradient(90deg,#3b82f6,#06b6d4))}
.lec-card:hover{border-color:#3b82f6;transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,0.45)}
.lec-card-num{font-size:11px;font-family:'IBM Plex Mono',monospace;color:#3b82f6;font-weight:600}
.lec-card-title{font-size:14.5px;font-weight:600;margin:6px 0 4px;color:var(--text);line-height:1.4}
.lec-card-sub{font-size:12px;color:var(--muted);line-height:1.6}
.lec-card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.lec-card-done{position:absolute;top:14px;right:14px;font-size:15px}
.tag{font-size:10.5px;padding:3px 8px;border-radius:8px;font-weight:500}
.tag-b{background:#1d3557;color:#60a5fa;border:1px solid rgba(59, 130, 246, 0.2)}
.tag-c{background:#0a2a2e;color:#22d3ee;border:1px solid rgba(6, 182, 212, 0.2)}
.tag-p{background:#1e1b35;color:#a78bfa;border:1px solid rgba(139, 92, 246, 0.2)}
.tag-g{background:#0a2a1e;color:#34d399;border:1px solid rgba(16, 185, 129, 0.2)}
.tag-o{background:#2a1e0a;color:#fbbf24;border:1px solid rgba(245, 158, 11, 0.2)}
.tag-r{background:#2a0a0a;color:#f87171;border:1px solid rgba(239, 68, 110, 0.2)}

/* ── LECTURE PAGE TABS ── */
.tabs-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:20px;background:var(--card);padding:6px;border-radius:var(--radius);border:1px solid var(--border)}
.tab-btn{padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);transition:all .15s;font-family:inherit}
.tab-btn.active{background:var(--blue);color:#fff}
.tab-btn:hover:not(.active){color:var(--text);background:#1a2740}
.tab-pane{display:none}.tab-pane.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── INFO CARD ── */
.info-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.info-card h3{font-size:13.5px;font-weight:700;color:#60a5fa;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.info-card p,.info-card li{font-size:13.5px;color:#94a3b8;line-height:1.9}
.info-card ul{padding-left:20px}
.ar-explain{background:linear-gradient(135deg,#080f1c,#0c1728);border:1px solid #1e3a5f;border-radius:var(--radius);padding:18px;font-family:'Cairo',sans-serif;direction:rtl;text-align:right;font-size:14px;color:#94a3b8;line-height:2.1;margin-bottom:14px}
.ar-explain strong{color:#60a5fa}

/* ── MARK DONE BTN ── */
.mark-done-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .2s;font-family:inherit;margin-bottom:16px}
.mark-done-btn.done{background:#0a2a1e;border-color:#10b98150;color:#34d399}
.mark-done-btn:hover:not(.done){border-color:#3b82f6;color:#60a5fa}

/* ── FORMULAS ── */
.formula-card{background:#07101c;border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;transition:border-color .2s}
.formula-card:hover{border-color:#1e3a5f}
.formula-eq{font-family:'IBM Plex Mono',monospace;font-size:15.5px;color:#06b6d4;margin:8px 0;padding:12px 16px;background:#040c18;border-radius:6px;border-left:3px solid #06b6d4;overflow-x:auto;white-space:nowrap}
.formula-name{font-size:13px;font-weight:700;color:#60a5fa;margin-bottom:4px}
.formula-desc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
.formula-vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.var-pill{font-size:10.5px;padding:3px 9px;background:#1a2a3a;color:#94a3b8;border-radius:6px;font-family:'IBM Plex Mono',monospace}

/* ── VIDEO ── */
.video-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:16px;transition:border-color .2s}
.video-card:hover{border-color:#1e3a5f}
.video-icon{width:44px;height:44px;border-radius:10px;background:#1d3557;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.video-info .video-title{font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:4px}
.video-info .video-desc{font-size:12px;color:var(--muted)}
.video-link{margin-left:auto;padding:7px 16px;background:#1d3557;color:#60a5fa;border:1px solid #1e3a5f;border-radius:7px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;transition:all .15s;flex-shrink:0}
.video-link:hover{background:#3b82f6;color:#fff;border-color:#3b82f6}

/* ── MCQ / PRACTICE ── */
.mcq-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.mcq-score{font-size:13px;color:var(--muted)}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;transition:border-color .2s}
.q-num{font-size:11px;font-family:'IBM Plex Mono',monospace;color:#3b82f6;font-weight:600;margin-bottom:8px}
.q-text{font-size:14px;color:var(--text);line-height:1.8;margin-bottom:14px}
.q-options{display:flex;flex-direction:column;gap:7px}
.q-opt{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;color:#94a3b8;transition:all .15s;background:none;text-align:left;width:100%;font-family:inherit}
.q-opt:hover:not(:disabled){border-color:#3b82f6;color:var(--text);background:#111d2e}
.q-opt.correct{border-color:#10b981!important;background:#071f14!important;color:#34d399!important}
.q-opt.wrong{border-color:#ef4444!important;background:#1c0707!important;color:#f87171!important}
.q-opt:disabled{cursor:default}
.q-opt .opt-letter{width:24px;height:24px;border-radius:6px;background:#1e2d40;color:#60a5fa;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;font-family:'IBM Plex Mono',monospace}

.explanation{margin-top:14px;padding:14px;border-radius:8px;font-size:13px;line-height:1.8;display:none}
.explanation.show{display:block}
.exp-correct{background:#071f14;border:1px solid rgba(16, 185, 129, 0.3);color:#6ee7b7}
.exp-wrong{background:#1c110a;border:1px solid rgba(245, 158, 11, 0.3);color:#fde68a}
.exp-ref{font-size:11px;color:#f59e0b;margin-top:6px;padding-top:6px;border-top:1px solid rgba(245, 158, 11, 0.2)}

.submit-btn{padding:11px 24px;background:linear-gradient(135deg,#1d4ed8,#1e3fa0);color:#fff;border:none;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.submit-btn:hover{background:linear-gradient(135deg,#2563eb,#1d4ed8);transform:translateY(-1px)}
.reset-btn{padding:11px 20px;background:var(--card);color:#94a3b8;border:1px solid var(--border);border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.reset-btn:hover{border-color:#3b82f6;color:#60a5fa}

.result-card{background:linear-gradient(135deg,#0a1828,#132140);border:1px solid #1e3a5f;border-radius:14px;padding:26px;margin-bottom:22px;text-align:center}
.result-score{font-size:46px;font-weight:700;font-family:'IBM Plex Mono',monospace}
.result-label{font-size:13.5px;color:#94a3b8;margin-top:4px}
.result-rating{font-size:16px;font-weight:700;margin-top:12px}

/* ── EXAM TIMER ── */
.exam-timer-bar{background:linear-gradient(135deg,#1a0c00,#2a1500);border:1px solid rgba(245, 158, 11, 0.3);border-radius:10px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.exam-timer-display{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:#fbbf24}
.exam-timer-display.warning{color:#ef4444;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.exam-progress-info{font-size:13px;color:#94a3b8;display:flex;gap:16px;align-items:center}

/* ── ANSWER REVIEW ── */
.review-section{margin-top:26px}
.review-header{font-size:15.5px;font-weight:700;color:#60a5fa;margin-bottom:16px;padding:12px 16px;background:#0a1525;border-radius:8px;border-left:4px solid #3b82f6;display:flex;align-items:center;gap:8px}
.review-q{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.review-q.correct-q{border-color:rgba(16, 185, 129, 0.3)}
.review-q.wrong-q{border-color:rgba(239, 68, 68, 0.3)}
.review-q-num{font-size:11px;font-family:'IBM Plex Mono',monospace;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.review-badge{font-size:10.5px;padding:2px 7px;border-radius:4px;font-weight:700}
.rb-correct{background:#0a2a1e;color:#34d399}
.rb-wrong{background:#2a0a0a;color:#f87171}
.rb-unanswered{background:#1a1a0a;color:#fbbf24}
.review-q-text{font-size:13.5px;color:var(--text);line-height:1.75;margin-bottom:10px}
.review-answer{font-size:12.5px;padding:7px 12px;border-radius:6px;margin-bottom:5px}
.ra-your{background:#111d2e;border-left:3px solid #3b82f6;color:#94a3b8}
.ra-correct{background:#071f14;border-left:3px solid #10b981;color:#34d399}
.ra-explain{font-size:12px;color:#6ee7b7;padding:10px 12px;background:#071f14;border-radius:6px;margin-top:8px;line-height:1.75;border:1px solid rgba(16, 185, 129, 0.2)}
.ra-explain.wrong-exp{color:#fde68a;background:#1c110a;border-color:rgba(245, 158, 11, 0.2)}

/* ── PDF SECTION & ACCORDIONS ── */
.pdf-section{background:linear-gradient(135deg,#0a0e1a,#111827);border:1px solid #1e2d40;border-radius:14px;padding:22px;margin-bottom:18px}
.pdf-section h3{font-size:15px;font-weight:700;color:#a78bfa;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.pdf-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#080d14;border:1px solid #1a2535;border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .2s}
.pdf-item:hover{border-color:#3b82f6;background:#0d1728}
.pdf-item-icon{font-size:24px;flex-shrink:0}
.pdf-item-info{flex:1}
.pdf-item-info strong{font-size:14px;font-weight:600;color:var(--text);display:block;margin-bottom:3px}
.pdf-item-info span{font-size:12px;color:var(--muted)}
.pdf-item-btn{padding:6px 16px;border-radius:7px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.pdf-view-btn{background:#1e1b35;color:#a78bfa}
.pdf-view-btn:hover{background:#8b5cf6;color:#fff}

.solution-panel{display:none;background:#090f1a;border:1px solid #1e3a5f;border-radius:10px;padding:16px;margin-top:-6px;margin-bottom:14px;animation:fadeIn .2s ease}
.sol-q-title{font-size:13px;font-weight:700;color:#3b82f6;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;border-bottom:1px solid #1a2740;padding-bottom:4px}
.sol-box{margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed #1e2d40}
.sol-box:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}

/* ── TOAST ── */

    STORE.setCompleted(done);

  updateProgressUI();
  updateNavDone();
  showLec(n);
  showToast('Lecture ' + n + ' saved to progress!');
}

  let done = STORE.getCompleted();
  done = done.filter(x => x !== n);
  STORE.setCompleted(done);
  updateProgressUI();
  updateNavDone();
  showLec(n);
  showToast('Removed from completed list.');
}

// GLOBAL LIVE DYNAMIC SEARCH
function handleSearch(val) {
  const drop = document.getElementById('search-dropdown');
  if(!val.trim()) {
    drop.classList.remove('open');
    return;
  }
  
  let html = '';
  const query = val.toLowerCase();
  
  // Search Lectures data object criteria
  for(let id in LECTURES) {
    const lec = LECTURES[id];
    if(lec.title.toLowerCase().includes(query) || lec.summary_en.toLowerCase().includes(query)) {
      html += `<div class="sr-item" onclick="showLec(${id})"><span class="sr-type">Lecture ${id}</span>${lec.title}</div>`;
    }
    // Search formula properties
    lec.formulas.forEach(f => {
      if(f.name.toLowerCase().includes(query) || f.eq.toLowerCase().includes(query)) {
        html += `<div class="sr-item" onclick="showLec(${id})"><span class="sr-type">Formula (Lec ${id})</span><strong>${f.name}</strong>: ${f.eq}</div>`;
      }
    });
  }
  
  drop.innerHTML = html ? html : '<div class="sr-empty">No matching records found</div>';
  drop.classList.add('open');
}

let trackingAnswers = {};

function selectQuizOpt(lId, qId, oId) {
  if(!trackingAnswers[lId]) trackingAnswers[lId] = {};
  trackingAnswers[lId][qId] = oId;
  
  // Style resetting choices
  const totalOpts = LECTURES[lId].mcq[qId].opts.length;
  for(let i=0; i<totalOpts; i++){
    document.getElementById(`lopt-${lId}-${qId}-${i}`).style.borderColor = '';
  }
  document.getElementById(`lopt-${lId}-${qId}-${oId}`).style.borderColor = 'var(--blue)';
}

function submitQuizModule(n) {
  const lec = LECTURES[n];
  let localScore = 0;
  
  lec.mcq.forEach((q, i) => {
    const selected = trackingAnswers[n] ? trackingAnswers[n][i] : undefined;
    const expEl = document.getElementById(`lexp-${n}-${i}`);
    
    // Disable inputs & map colors
    q.opts.forEach((_, oIdx) => {
      const btn = document.getElementById(`lopt-${n}-${i}-${oIdx}`);
      if(oIdx === q.ans) {
        btn.classList.add('correct');
      } else if(selected === oIdx) {
        btn.classList.add('wrong');
      }
    });
    
    if(selected === q.ans) localScore++;
    
    if(expEl) {
      expEl.innerHTML = `<strong>Explanation:</strong> ${q.exp} <br><span style="color:#22d3ee">${q.ref}</span>`;
      expEl.className = "explanation show " + (selected === q.ans ? "exp-correct" : "exp-wrong");
    }
  });
  
  STORE.setQuizScore(n, localScore);
  document.getElementById(`quiz-score-display-${n}`).textContent = `⭐ Highest Score Achieved: ${localScore} / ${lec.mcq.length}`;
  showToast(`Quiz checked! Score: ${localScore}/${lec.mcq.length}`);
}

          <p><strong>English Workings:</strong> E = (10 × 10⁻⁹) / (2 × π × 8.854×10⁻¹² × 0.02) = 8993 V/m ≈ 9000 V/m. Verified choice is 'C'.</p>
        </div>
      </div>

      <div class="pdf-item" onclick="toggleSolutionPanel('final-sol-panel')">
        <div class="pdf-item-icon">📑</div>
        <div class="pdf-item-info">
          <strong>Final Exam — Comprehensive Solved Summary Panel</strong>
          <span>Click to view analytical English/Arabic explanations for all questions including full verification for Q12</span>
        </div>
        <button class="pdf-item-btn pdf-view-btn">👁 View Worked Solves</button>
      </div>

      <div class="solution-panel" id="final-sol-panel">
        <div class="sol-box">
          <div class="sol-q-title">Q1: Boundary Conditions Continuity</div>
          <p class="ar-text"><strong>الحل النموذجي:</strong> عند السطح الفاصل بين عازلين وخلوه من الشحنات السطحية الحرة، المركبة العمودية لمتجه الإزاحة تكون مستمرة <strong>D₁n = D₂n</strong>.</p>
        </div>
        <div class="sol-box">
          <div class="sol-q-title">🔥 Q12: Equilateral Triangle Force Check (18 mN Solution Verification)</div>
          <p class="ar-text"><strong>الحل النموذجي بالتفصيل:</strong> لدينا ثلاثة شحنات عند رؤوس مثلث متساوي الأضلاع طول ضلعه 1 متر. القوة المتبادلة بين الشحنة الأولى والثانية تحسب مباشرة بتطبيق قانون كولوم الأساسي دون تشتيت:<br>
          F = k · |Q₁ · Q₂| / R²<br>
          F = (9 × 10⁹) · (1 × 10⁻⁶) · (2 × 10⁻⁶) / (1)² = 18 × 10⁻³ نيوتن = <strong>18 mN</strong>.<br>
          الاختيار الصحيح والمنظومي على النظام هو <strong>b) 18 mN</strong>. تأكد من مطابقة الـ indexes لتجنب الخطأ العشوائي.</p>
          <p><strong>English Math:</strong> F = 9e9 * 1e-6 * 2e-6 / 1.0 = 0.018 N = 18 mN. Verified selection logic checks option 'b'.</p>
        </div>
      </div>
    </div>
    
    <div id="active-exam-simulator-zone"></div>
  `;
}

function toggleSolutionPanel(id) {
  const panel = document.getElementById(id);
  if(panel) {
    panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
  }
}

// INTERACTIVE SIMULATION TEST ENGINE MODULE
let liveExamAnswers = {};
function startExamSession(type) {
  liveExamAnswers = {};
  const zone = document.getElementById('active-exam-simulator-zone');
  const questions = type === 'midterm' ? MIDTERM_QUESTIONS : FINAL_QUESTIONS;
  
  window.scrollTo({ top: zone.offsetTop - 20, behavior: 'smooth' });
  
  zone.innerHTML = `
    <div class="review-section">
      <div class="review-header">
        ⚡ Live Test Simulator Mode: ${type.toUpperCase()} MODEL
      </div>
      
      ${questions.map((q, i) => `
        <div class="review-q">
          <div class="review-q-num">Q${q.num} · <span style="color:#94a3b8">${q.topic}</span></div>
          <div class="review-q-text">${q.q}</div>
          <div class="q-options" style="margin-bottom:12px">
            ${q.opts.map((opt, oIdx) => `
              <button class="q-opt" id="exopt-${type}-${i}-${oIdx}" onclick="selectExamChoice('${type}',${i},${oIdx})">
                <span class="opt-letter">${['a','b','c','d'][oIdx]}</span> ${opt}
              </button>
            `).join('')}
          </div>
          <div class="explanation" id="exexp-${type}-${i}"></div>
        </div>
      `).join('')}
      
      <button class="submit-btn" style="width:100%; padding:14px" onclick="evaluateExamSimulation('${type}')">Submit Exam Paper</button>
    </div>
  `;
}

function selectExamChoice(type, qIdx, oIdx) {
  const questions = type === 'midterm' ? MIDTERM_QUESTIONS : FINAL_QUESTIONS;
  const totalOpts = questions[qIdx].opts.length;
  
  liveExamAnswers[qIdx] = oIdx;
  
  for(let i=0; i<totalOpts; i++) {
    document.getElementById(`exopt-${type}-${qIdx}-${i}`).style.borderColor = '';
  }
  document.getElementById(`exopt-${type}-${qIdx}-${oIdx}`).style.borderColor = 'var(--cyan)';
}

function evaluateExamSimulation(type) {
  const questions = type === 'midterm' ? MIDTERM_QUESTIONS : FINAL_QUESTIONS;
  let correctCount = 0;
  
  questions.forEach((q, i) => {
    const selected = liveExamAnswers[i];
    const expEl = document.getElementById(`exexp-${type}-${i}`);
    
    q.opts.forEach((_, oIdx) => {
      const btn = document.getElementById(`exopt-${type}-${i}-${oIdx}`);
      if(oIdx === q.ans) {
        btn.classList.add('correct');
      } else if(selected === oIdx) {
        btn.classList.add('wrong');
      }
    });
    
    if(selected === q.ans) correctCount++;
    
    if(expEl) {
      expEl.innerHTML = `${q.ans_detail}<br><strong>Explanation:</strong> ${q.exp}`;
      expEl.className = "explanation show " + (selected === q.ans ? "exp-correct" : "exp-wrong");
    }
  });
  
  if(type === 'midterm') STORE.setMidtermScore(correctCount);
  else STORE.setFinalScore(correctCount);
  
  showToast(`Exam calculation complete: ${correctCount} / ${questions.length} Correct.`);
}
</script>
